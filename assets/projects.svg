<g class="l" style="animation-delay:0.2s"><text x="74" y="126"><tspan class="k">┌──(</tspan><tspan class="c bold">rewantth㉿kali</tspan><tspan class="k">)-[</tspan><tspan class="w bold">~/projects</tspan><tspan class="k">]</tspan></text><text x="74" y="146"><tspan class="k">└─</tspan><tspan class="c bold">$ </tspan><tspan class="w">ls -1</tspan></text></g><g class="l" style="animation-delay:0.34s"><rect x="74" y="174" width="416" height="140" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#1b2a3f"/><text x="90" y="200" class="w bold s15">sentinel-travel/</text><text x="474" y="200" text-anchor="end" class="c s12">public</text><text x="90" y="222" class="d s13">identity threat detection and impossible-travel</text><text x="90" y="239" class="d s13">analytics, shown as a live SOC console.</text><text x="90" y="286" class="c s12">FastAPI · React · SQLite · WebSockets · Leaflet ·…</text><text x="90" y="304" class="g s12">● portfolio project, synthetic data only</text></g><g class="l" style="animation-delay:0.48s"><rect x="504" y="174" width="416" height="140" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#1b2a3f"/><text x="520" y="200" class="w bold s15">sentinelops/</text><text x="904" y="200" text-anchor="end" class="c s12">public</text><text x="520" y="222" class="d s13">SOC alert triage and investigation console with</text><text x="520" y="239" class="d s13">MITRE ATT&amp;CK mapping and case tracking.</text><text x="520" y="286" class="c s12">Flask · SQLAlchemy · SQLite · Chart.js · JavaScri…</text><text x="520" y="304" class="g s12">● portfolio project, safe simulated alerts</text></g><g class="l" style="animation-delay:0.62s"><rect x="74" y="328" width="416" height="140" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#1b2a3f"/><text x="90" y="354" class="w bold s15">phishguard-x/</text><text x="474" y="354" text-anchor="end" class="c s12">public</text><text x="90" y="376" class="d s13">explainable phishing detection and email threat</text><text x="90" y="393" class="d s13">analysis.</text><text x="90" y="440" class="c s12">Python · Flask · pytest</text><text x="90" y="458" class="g s12">● portfolio project</text></g><g class="l" style="animation-delay:0.76s"><rect x="504" y="328" width="416" height="140" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#1b2a3f"/><text x="520" y="354" class="w bold s15">securewave-net/</text><text x="904" y="354" text-anchor="end" class="c s12">public</text><text x="520" y="376" class="d s13">an enterprise branch network with VLAN</text><text x="520" y="393" class="d s13">segmentation, a DMZ and routed security zones,</text><text x="520" y="410" class="d s13">built in Cisco Packet Tracer.</text><text x="520" y="440" class="c s12">Cisco Packet Tracer · VLANs · SVIs · DHCP · DNS ·…</text><text x="520" y="458" class="g s12">● core network complete. ACLs, port security and OSPF…</text></g><g class="l" style="animation-delay:0.9s"><rect x="74" y="482" width="416" height="140" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#1b2a3f"/><text x="90" y="508" class="w bold s15">cdsa-study-tracker/</text><text x="474" y="508" text-anchor="end" class="c s12">public</text><text x="90" y="530" class="d s13">a free, offline study tracker for the HTB SOC</text><text x="90" y="547" class="d s13">Analyst path and the CDSA exam. no accounts, no</text><text x="90" y="564" class="d s13">backend, no network requests.</text><text x="90" y="594" class="c s12">single-file HTML · JavaScript · CSS</text><text x="90" y="612" class="g s12">● live, progress never leaves the browser</text></g><g class="l" style="animation-delay:1.04s"><rect x="504" y="482" width="416" height="140" rx="10" fill="#ffffff" fill-opacity=".03" stroke="#1b2a3f"/><text x="520" y="508" class="w bold s15">inbox-dashboard/</text><text x="904" y="508" text-anchor="end" class="y s12">private</text><text x="520" y="530" class="d s13">a security-first dashboard that turns the emails</text><text x="520" y="547" class="d s13">in a mailbox into a live, encrypted web page.</text><text x="520" y="594" class="c s12">Python 3.12 · Gmail API · WebCrypto · vanilla JS …</text><text x="520" y="612" class="g s12">● running, source private</text></g>
