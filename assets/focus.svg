<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="486" viewBox="0 0 1000 486" role="img" aria-label="Kali terminal showing what the projects are about: detection, defence, explainability and method">
<title>Kali terminal showing what the projects are about: detection, defence, explainability and method</title>
<defs>
<style>text{font-family:"JetBrains Mono","Fira Code","Cascadia Code",Consolas,Menlo,"DejaVu Sans Mono",monospace;font-size:14px;white-space:pre}.k{fill:#367BF0}.g{fill:#00ff9c}.w{fill:#e6edf3}.d{fill:#7d8da3}.c{fill:#00e5ff}.r{fill:#ff4d4d}.y{fill:#ffd866}.pu{fill:#b48cff}.bold{font-weight:700}.s13{font-size:13px}.s12{font-size:12px}.s11{font-size:11px}.s15{font-size:15px}.s18{font-size:18px}.s24{font-size:24px}.l{opacity:0;animation:show .01s linear forwards}@keyframes show{to{opacity:1}}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.sweep{animation:sweep 7s linear infinite}@keyframes sweep{from{transform:translateY(-140px)}to{transform:translateY(900px)}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}@media (prefers-reduced-motion:reduce){.l{animation-duration:0s;animation-delay:0s!important}.cur,.sweep,.pulse{animation:none}.sweep{display:none}}</style>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060a11"/><stop offset="1" stop-color="#02040a"/></linearGradient>
<radialGradient id="g1" cx="80%" cy="88%" r="60%"><stop offset="0" stop-color="#367BF0" stop-opacity=".26"/><stop offset="1" stop-color="#367BF0" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="10%" cy="6%" r="55%"><stop offset="0" stop-color="#00ff9c" stop-opacity=".08"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#367BF0" stroke-opacity=".09"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" opacity=".26"/></pattern>
<linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset=".55" stop-color="#00ff9c" stop-opacity=".09"/><stop offset="1" stop-color="#00ff9c" stop-opacity="0"/></linearGradient>
<clipPath id="win"><rect x="50" y="62" width="900" height="356" rx="12"/></clipPath>

</defs>
<rect width="1000" height="486" fill="url(#bg)"/><rect width="1000" height="486" fill="url(#g1)"/><rect width="1000" height="486" fill="url(#g2)"/><rect width="1000" height="486" fill="url(#grid)"/>
<rect width="1000" height="40" fill="#04080e" opacity=".92"/><path d="M0 40H1000" stroke="#1b2a3f"/>
<text x="18" y="25" class="g bold s15">rewantth</text><text x="132" y="25" class="d" style="font-size:13px">1 home</text><text x="218" y="25" class="d" style="font-size:13px">2 projects</text><rect x="324" y="6" width="89" height="28" rx="7" fill="#367BF0"/><text x="338" y="25" style="font-size:13px" fill="#04101f" class="bold">3 focus</text><text x="433" y="25" class="d" style="font-size:13px">4 blog</text><text x="519" y="25" class="d" style="font-size:13px">5 stats</text><circle cx="904" cy="20" r="4.5" fill="#ff5f56"/><circle cx="920" cy="20" r="4.5" fill="#ffbd2e"/><circle cx="936" cy="20" r="4.5" fill="#27c93f"/><circle cx="952" cy="20" r="4.5" fill="#367BF0"/><circle cx="968" cy="20" r="4.5" fill="#b48cff"/>

<rect x="50" y="62" width="900" height="356" rx="12" fill="#080e17" fill-opacity=".94" stroke="#1b2a3f"/>
<g clip-path="url(#win)"><rect x="50" y="62" width="900" height="38" fill="#0d141d"/>
<circle cx="72" cy="81" r="6" fill="#ff5f56"/><circle cx="92" cy="81" r="6" fill="#ffbd2e"/><circle cx="112" cy="81" r="6" fill="#27c93f"/>
<text x="500" y="86" text-anchor="middle" class="d s13">rewantth@kali: ~</text>
<g class="l" style="animation-delay:0.2s"><text x="74" y="126"><tspan class="k">┌──(</tspan><tspan class="c bold">rewantth㉿kali</tspan><tspan class="k">)-[</tspan><tspan class="w bold">~</tspan><tspan class="k">]</tspan></text><text x="74" y="146"><tspan class="k">└─</tspan><tspan class="c bold">$ </tspan><tspan class="w">cat focus.md</tspan></text></g><g class="l" style="animation-delay:0.38s"><text x="74" y="188" class="g bold s15"># focus</text></g><g class="l" style="animation-delay:0.56s"><text x="74" y="220" class="k bold">detection</text><text x="214" y="220" class="w">spot attacks in data: impossible travel, phishing, alert triage and MITRE ATT&amp;CK</text><text x="214" y="240" class="w">mapping</text></g><g class="l" style="animation-delay:0.74s"><text x="74" y="274" class="k bold">defence</text><text x="214" y="274" class="w">segment networks, apply least privilege and protect data with encryption</text></g><g class="l" style="animation-delay:0.92s"><text x="74" y="308" class="k bold">explainable</text><text x="214" y="308" class="w">every alert, score and finding shows the evidence behind it</text></g><g class="l" style="animation-delay:1.1s"><text x="74" y="342" class="k bold">method</text><text x="214" y="342" class="w">synthetic or self-owned data only, and authorized targets only</text></g><g class="l" style="animation-delay:1.46s"><text x="74" y="386"><tspan class="k">└─</tspan><tspan class="c bold">$ </tspan></text><rect class="cur" x="114" y="373" width="9" height="16" fill="#00ff9c"/></g>
<rect x="50" y="62" width="900" height="356" fill="url(#scan)"/><rect class="sweep" x="50" y="62" width="900" height="130" fill="url(#bar)"/></g>
<rect y="442" width="1000" height="44" fill="#04080e" opacity=".94"/><path d="M0 442H1000" stroke="#1b2a3f"/>
<rect x="14" y="448" width="132" height="30" rx="8" fill="#367BF0" fill-opacity=".14" stroke="#367BF0"/><text x="30" y="468" class="w s13">zsh ~ kali</text>
<text x="984" y="468" text-anchor="end" class="d s13">rewantth@kali</text>
</svg>
