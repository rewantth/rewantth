<circle cx="72" cy="81" r="6" fill="#ff5f56"/><circle cx="92" cy="81" r="6" fill="#ffbd2e"/><circle cx="112" cy="81" r="6" fill="#27c93f"/>
<text x="500" y="86" text-anchor="middle" class="d s13">rewantth@kali: ~</text>
<g class="l" style="animation-delay:0.2s"><text x="74" y="126"><tspan class="k">┌──(</tspan><tspan class="c bold">rewantth㉿kali</tspan><tspan class="k">)-[</tspan><tspan class="w bold">~</tspan><tspan class="k">]</tspan></text><text x="74" y="146"><tspan class="k">└─</tspan><tspan class="c bold">$ </tspan><tspan class="w">cat about.md</tspan></text></g><g class="l" style="animation-delay:0.38s"><text x="74" y="188" class="g bold s15"># about</text></g><g class="l" style="animation-delay:0.2s"><text x="74" y="216" class="w">I am a cybersecurity student who learns by building. Every project here is something I can</text></g><g class="l" style="animation-delay:0.2s"><text x="74" y="236" class="w">run, break and explain, and each one is on the defender's side: spotting attacks in data,</text></g><g class="l" style="animation-delay:0.2s"><text x="74" y="256" class="w">triaging alerts, segmenting networks and protecting information with encryption.</text></g><g class="l" style="animation-delay:0.2s"><text x="74" y="276" class="w"></text></g><g class="l" style="animation-delay:0.2s"><text x="74" y="296" class="w">Everything uses synthetic or self-owned data, and I only test on systems I am authorized to.</text></g><g class="l" style="animation-delay:0.74s"><text x="74" y="328" class="k bold">## right now</text></g><g class="l" style="animation-delay:0.92s"><text x="74" y="354" class="c bold">studying</text><text x="214" y="354" class="w">the HTB SOC Analyst path and the CDSA exam (I built the study tracker for</text><text x="214" y="374" class="w">it)</text></g><g class="l" style="animation-delay:1.1s"><text x="74" y="400" class="c bold">building</text><text x="214" y="400" class="w">ACLs, port security and OSPF for securewave-net</text></g><g class="l" style="animation-delay:1.28s"><text x="74" y="426" class="c bold">writing</text><text x="214" y="426" class="w">short writeups on the security decisions behind my projects</text></g><g class="l" style="animation-delay:1.46s"><text x="74" y="466" class="k bold">## toolbox</text></g><g class="l" style="animation-delay:1.64s"><text x="74" y="492" class="c bold">languages</text><text x="214" y="492" class="w">Python JavaScript HTML CSS</text></g><g class="l" style="animation-delay:1.82s"><text x="74" y="518" class="c bold">web / data</text><text x="214" y="518" class="w">FastAPI Flask React SQLite SQLAlchemy Chart.js</text></g><g class="l" style="animation-delay:2.0s"><text x="74" y="544" class="c bold">security</text><text x="214" y="544" class="w">MITRE ATT&amp;CK AES-256-GCM PBKDF2 CSP WebCrypto VLANs DMZ AAA</text></g><g class="l" style="animation-delay:2.18s"><text x="74" y="570" class="c bold">tools</text><text x="214" y="570" class="w">Kali Linux Cisco Packet Tracer GitHub Actions pytest</text></g><g class="l" style="animation-delay:2.36s"><text x="74" y="610"><tspan class="k">└─</tspan><tspan class="c bold">$ </tspan></text><rect class="cur" x="114" y="597" width="9" height="16" fill="#00ff9c"/></g>
<rect x="50" y="62" width="900" height="584" fill="url(#scan)"/><rect class="sweep" x="50" y="62" width="900" height="130" fill="url(#bar)"/></g>
