<text x="18" y="25" class="g bold s15">rewantth</text><text x="132" y="25" class="d" style="font-size:13px">1 home</text><rect x="204" y="6" width="89" height="28" rx="7" fill="#367BF0"/><text x="218" y="25" style="font-size:13px" fill="#04101f" class="bold">2 about</text><text x="313" y="25" class="d" style="font-size:13px">3 projects</text><text x="433" y="25" class="d" style="font-size:13px">4 focus</text><text x="528" y="25" class="d" style="font-size:13px">5 blog</text><text x="614" y="25" class="d" style="font-size:13px">6 stats</text><circle cx="904" cy="20" r="4.5" fill="#ff5f56"/><circle cx="920" cy="20" r="4.5" fill="#ffbd2e"/><circle cx="936" cy="20" r="4.5" fill="#27c93f"/><circle cx="952" cy="20" r="4.5" fill="#367BF0"/><circle cx="968" cy="20" r="4.5" fill="#b48cff"/>

